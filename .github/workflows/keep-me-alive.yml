name: Keep Supabase Active

on:
  schedule:
    - cron: '0 0 */4 * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Health Endpoint
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          TARGET_URL="${SUPABASE_URL}/auth/v1/health"
          echo "Pinging $TARGET_URL..."
          curl --globoff --fail --silent --show-error --location "$TARGET_URL" \
            --output /dev/null
