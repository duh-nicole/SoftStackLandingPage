name: Keep Supabase Active

on:
  schedule:
    - cron: '0 0 */4 * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Endpoint
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          TARGET_URL="${SUPABASE_URL}/rest/v1/"
          echo "Sending ping to Supabase..."
          curl --globoff --fail --silent --show-error --location "$TARGET_URL" \
            --header "apikey: $SUPABASE_ANON_KEY" \
            --output /dev/null
