name: Keep Supabase Active

on:
  schedule:
    - cron: '0 0 */4 * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Send GET Request to Supabase REST API
        run: |
          TARGET_URL="${{ secrets.SUPABASE_URL }}/rest/v1/"
          API_KEY="${{ secrets.SUPABASE_ANON_KEY }}"
          echo "Pinging Supabase REST API..."
          curl --globoff --fail --silent --show-error --location "$TARGET_URL" \
            -H "apikey: $API_KEY" \
            -H "Authorization: Bearer $API_KEY" \
            --output /dev/null
